<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kay Games</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- App icons -->
<link rel="icon" type="image/x-icon" href="AppFiles/Icons/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="AppFiles/Logos/AppIcon192px.png">
<link rel="icon" type="image/png" sizes="512x512" href="AppFiles/Logos/AppIcon512px.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1210">
<!-- End app icons -->
    
</head>
<body>
    <div class="container">
        <header>
            <h1>Kay Games</h1>
        </header>

        <div class="controls" id="filters-container">
        </div>

        <div class="games-grid" id="games-container">
            <div class="no-games">Loading games...</div>
        </div>
    </div>

    <!-- Rules Modal -->
    <div class="modal" id="rules-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <h2 class="modal-title" id="modal-title">Game Rules</h2>
            <div class="modal-rules" id="modal-rules"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
