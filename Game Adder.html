<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Kay Games editor</title>

    <!-- App icons -->
    <link rel="icon" type="image/x-icon" href="AppFiles/Icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="AppFiles/Logos/AppIcon192px.png">
    <link rel="icon" type="image/png" sizes="512x512" href="AppFiles/Logos/AppIcon512px.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#131313">
    <!-- End app icons -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #131313;
            --surface: #1a1a1a;
            --surface-2: #222222;
            --surface-3: #2a2a2a;
            --line: #2c2c2c;
            --line-strong: #404040;

            --text: #ededed;
            --text-dim: #a6a6a6;
            --text-faint: #767676;

            --orange: #ffa238;
            --orange-dim: rgba(255, 162, 56, 0.14);
            --blue: #6babff;
            --blue-dim: rgba(107, 171, 255, 0.14);
            --danger: #ff7a6b;
            --danger-dim: rgba(255, 122, 107, 0.12);

            --font-display: 'Syne', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --font-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 14px;
            --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
            --topbar-h: 88px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.65;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            padding: 0
                calc(24px + env(safe-area-inset-right, 0px))
                calc(56px + env(safe-area-inset-bottom, 0px))
                calc(24px + env(safe-area-inset-left, 0px));
            -webkit-font-smoothing: antialiased;
        }

        body:has(dialog[open]) { overflow: hidden; }

        .app { max-width: 1400px; margin: 0 auto; }

        /* ---------- Top bar ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 24px;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 0 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(1.6rem, 4vw, 2.25rem);
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .file-status {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .pill {
            font-size: 0.72rem;
            line-height: 1;
            padding: 4px 9px;
            border-radius: 999px;
            border: 1px solid var(--line-strong);
            color: var(--text-dim);
        }
        .pill[data-state="dirty"] { color: var(--orange); background: var(--orange-dim); border-color: transparent; }
        .pill[data-state="saved"] { color: var(--blue); background: var(--blue-dim); border-color: transparent; }

        .topbar-actions { display: flex; flex-wrap: wrap; gap: 8px; }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1;
            height: 42px;
            padding: 0 16px;
            border-radius: var(--radius);
            border: 1px solid var(--line-strong);
            background: transparent;
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
        }
        .btn:hover:not(:disabled) { border-color: var(--text-dim); background: var(--surface-3); }
        .btn:active:not(:disabled) { transform: translateY(1px); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-sm { height: 36px; padding: 0 12px; font-size: 0.85rem; }

        .btn-primary { background: var(--orange); border-color: var(--orange); color: #131313; }
        .btn-primary:hover:not(:disabled) { background: #ffb257; border-color: #ffb257; }

        .btn-danger { color: var(--danger); border-color: rgba(255, 122, 107, 0.4); }
        .btn-danger:hover:not(:disabled) { background: var(--danger-dim); border-color: var(--danger); }

        .btn svg, .icon {
            width: 16px; height: 16px; flex: none;
            stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
        }

        /* ---------- Welcome ---------- */
        .welcome {
            max-width: 560px;
            margin: 72px auto 0;
            padding: 48px 32px;
            text-align: center;
            border: 1px dashed var(--line-strong);
            border-radius: var(--radius-lg);
        }
        .welcome h2 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }
        .welcome p { color: var(--text-dim); max-width: 46ch; margin: 0 auto 24px; }
        .welcome-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

        /* ---------- Workspace ---------- */
        .workspace {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 24px;
            align-items: start;
            padding-top: 20px;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            position: sticky;
            top: calc(var(--topbar-h) + 16px);
            max-height: calc(100vh - var(--topbar-h) - 32px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
        }

        .sidebar .btn { 
        width: 100%;
        min-height: 44px;
        }

        .list-count { font-size: 0.78rem; color: var(--text-faint); padding: 0 4px; }

        .game-list {
            list-style: none;
            padding: 0;
            margin: 0 -4px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            overscroll-behavior: contain;
        }
        .game-list::-webkit-scrollbar { width: 8px; }
        .game-list::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

        .game-list li { padding: 0 4px; }
        .game-list .list-empty { padding: 16px 8px; color: var(--text-faint); font-size: 0.85rem; }

        .game-item {
            display: grid;
            gap: 2px;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            margin-bottom: 2px;
            font: inherit;
            color: var(--text);
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease);
        }
        .game-item:hover { background: var(--surface-2); }
        .game-item[aria-current="true"] { background: var(--orange-dim); border-color: rgba(255, 162, 56, 0.45); }

        .game-item-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .game-item-name {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.25;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .game-item-name.is-blank { color: var(--text-faint); font-style: italic; }

        .game-item-flag {
            flex: none;
            width: 18px; height: 18px;
            display: grid; place-items: center;
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: 500;
            color: #131313;
            background: var(--orange);
        }

        .game-item-meta {
            display: flex; flex-wrap: wrap; gap: 0 12px;
            font-size: 0.75rem;
            color: var(--text-dim);
            min-height: 1.2em;
        }

        /* ---------- Editor ---------- */
        .editor-empty {
            display: grid;
            place-items: center;
            text-align: center;
            gap: 16px;
            padding: 64px 24px;
            color: var(--text-dim);
            border: 1px dashed var(--line-strong);
            border-radius: var(--radius-lg);
        }
        .editor-empty p { max-width: 40ch; }

        .editor-head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .editor-head h2 {
            flex: 1 1 200px;
            min-width: 0;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(1.4rem, 3vw, 1.9rem);
            letter-spacing: -0.02em;
            line-height: 1.15;
            overflow-wrap: anywhere;
        }
        .editor-head-actions { display: flex; gap: 8px; }
        .btn-back { display: none; }

        .editor-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 24px;
            align-items: start;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .form-section + .form-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
        }
        .form-section h3 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
            margin-bottom: 16px;
        }

        .section-grid { display: grid; gap: 18px; }
        .section-details, .section-links {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
        }

        .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .field > label {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        input[type="text"], input[type="search"], textarea {
            width: 100%;
            font: inherit;
            font-size: 0.85rem;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 0 16px;
            height: 44px;
            transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
        }
        textarea {
            height: auto;
            padding: 12px 16px;
            line-height: 1.7;
            resize: vertical;
            min-height: 44px;
        }
        .sidebar input[type="search"] { 
            background: var(--bg);
            min-height: 44px;
        }
        input::placeholder, textarea::placeholder { color: var(--text-faint); }
        input[type="search"]::-webkit-search-cancel-button { filter: invert(0.7); cursor: pointer; }
        input:hover, textarea:hover { border-color: var(--line-strong); }
        input:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-dim); }
        input[aria-invalid="true"] { border-color: var(--danger); }

        .hint { font-size: 0.76rem; color: var(--text-faint); }
        .msg { font-size: 0.78rem; }
        .msg[data-tone="error"] { color: var(--danger); }
        .msg[data-tone="warn"] { color: var(--orange); }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chips:empty { display: none; }
        .chip {
            font: inherit;
            font-size: 0.75rem;
            line-height: 1;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--line-strong);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: background-color 0.15s var(--ease), color 0.15s var(--ease);
        }
        .chip:hover { color: var(--text); background: var(--surface-3); }
        .chip[aria-pressed="true"] { color: var(--blue); background: var(--blue-dim); border-color: transparent; }

        /* ---------- Preview ---------- */
        .preview-wrap h3 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }
        .preview-wrap > p { font-size: 0.78rem; color: var(--text-faint); margin-bottom: 12px; }

        .card {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .card-media { aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; border-bottom: 1px solid var(--line); }
        .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .media-fallback {
            width: 100%; height: 100%;
            display: grid; place-items: center;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 4.5rem;
            line-height: 1;
            color: var(--orange);
            background:
                repeating-linear-gradient(135deg, transparent 0 14px, rgba(255, 255, 255, 0.025) 14px 15px),
                var(--surface-2);
        }
        .card-body { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
        .card-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.35rem;
            line-height: 1.15;
            letter-spacing: -0.015em;
            overflow-wrap: anywhere;
        }
        .card-title.is-link span { border-bottom: 2px solid var(--orange); padding-bottom: 2px; }
        .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.82rem; }
        .facts span { display: inline-flex; align-items: center; gap: 6px; }
        .facts svg { width: 14px; height: 14px; flex: none; stroke: var(--text-faint); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .tags { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; }
        .tag { font-size: 0.75rem; line-height: 1; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text-dim); }
        .tag.tag-type { color: var(--blue); background: var(--blue-dim); border-color: transparent; }
        .card-desc { color: var(--text-dim); font-size: 0.85rem; line-height: 1.7; overflow-wrap: anywhere; }
        .card-actions { display: flex; gap: 8px; }
        .card-actions .btn { flex: 1; cursor: default; }

        /* ---------- Toasts ---------- */
        .toasts {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: min(520px, calc(100% - 32px));
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 12px 16px;
            font-size: 0.85rem;
            background: var(--surface-3);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            animation: toast-in 0.2s var(--ease);
        }
        .toast span { flex: 1; }
        .toast-error { border-color: var(--danger); }
        .toast-success { border-color: var(--blue); }
        .toast-action {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--orange);
            background: none;
            border: 0;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .toast-action:hover { background: var(--orange-dim); }
        @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ---------- Confirm dialog ---------- */
        dialog {
            width: min(440px, calc(100% - 32px));
            padding: 24px;
            margin: auto;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-lg);
            background: var(--surface);
            color: var(--text);
        }
        dialog[open] { animation: toast-in 0.2s var(--ease); }
        dialog::backdrop { background: rgba(8, 8, 8, 0.78); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        dialog h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; margin-bottom: 8px; }
        dialog p { color: var(--text-dim); margin-bottom: 24px; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

        /* ---------- Drag overlay ---------- */
        body.dragging::after {
            content: 'Drop Games.json to open it';
            position: fixed;
            inset: 12px;
            z-index: 300;
            display: grid;
            place-items: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--orange);
            background: rgba(19, 19, 19, 0.92);
            border: 2px dashed var(--orange);
            border-radius: 18px;
            pointer-events: none;
        }

        /* ---------- Focus & motion ---------- */
        :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
        input:focus-visible, textarea:focus-visible { outline: none; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

        /* ---------- Responsive ---------- */
        @media (min-width: 1240px) {
            .editor-layout { grid-template-columns: minmax(0, 1fr) 340px; }
            .preview-wrap { position: sticky; top: calc(var(--topbar-h) + 16px); }
        }

        @media (max-width: 899px) {
            .workspace { grid-template-columns: minmax(0, 1fr); }
            .sidebar { position: static; max-height: none; }
            .game-list { max-height: 60vh; }
            .workspace[data-view="list"] .editor { display: none; }
            .workspace[data-view="edit"] .sidebar { display: none; }
            .btn-back { display: inline-flex; }
            .topbar-actions .btn { height: 38px; padding: 0 12px; }
        }

        @media (max-width: 640px) {
            body { padding-left: calc(16px + env(safe-area-inset-left, 0px)); padding-right: calc(16px + env(safe-area-inset-right, 0px)); }
            .panel { padding: 16px; }
            .topbar-actions { width: 100%; }
            .topbar-actions .btn { flex: 1; }
            .editor-head-actions { width: 100%; }
            .editor-head-actions .btn { flex: 1; }
            .welcome { margin-top: 32px; padding: 32px 20px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="topbar" id="topbar">
            <div>
                <h1>Games editor</h1>
                <p class="file-status" id="file-status"></p>
            </div>
            <div class="topbar-actions">
                <button type="button" class="btn" id="btn-open">Open file</button>
                <button type="button" class="btn" id="btn-copy">Copy JSON</button>
                <button type="button" class="btn" id="btn-download">Download</button>
                <button type="button" class="btn btn-primary" id="btn-save" title="Save (Ctrl or Cmd + S)">Save</button>
            </div>
        </header>

        <!-- Shown until a Games.json is loaded -->
        <section class="welcome" id="welcome" hidden>
            <h2>Open your Games.json</h2>
            <p id="welcome-text">Pick the Games.json from your repo folder to edit it in place, or drop it anywhere on this page. You can also start a fresh list.</p>
            <div class="welcome-actions">
                <button type="button" class="btn btn-primary" id="welcome-open">Open Games.json</button>
                <button type="button" class="btn" id="welcome-new">Start a new list</button>
            </div>
        </section>

        <div class="workspace" id="workspace" data-view="list" hidden>
            <aside class="sidebar" aria-label="Games">
                <button type="button" class="btn btn-primary" id="btn-new">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
                    New game
                </button>
                <input type="search" id="list-search" placeholder="Find a game" aria-label="Find a game" autocomplete="off">
                <p class="list-count" id="list-count" role="status"></p>
                <ul class="game-list" id="game-list"></ul>
            </aside>

            <section class="editor" id="editor" aria-label="Game editor">
                <div class="editor-empty" id="editor-empty" hidden>
                    <p id="editor-empty-text">Pick a game from the list to edit it, or add a new one.</p>
                    <button type="button" class="btn btn-primary" id="empty-new">New game</button>
                </div>

                <div id="editor-main" hidden>
                    <div class="editor-head">
                        <button type="button" class="btn btn-sm btn-back" id="btn-back">
                            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
                            All games
                        </button>
                        <h2 id="editor-title">New game</h2>
                        <div class="editor-head-actions">
                            <button type="button" class="btn btn-sm" id="btn-duplicate">Duplicate</button>
                            <button type="button" class="btn btn-sm btn-danger" id="btn-delete">Delete</button>
                        </div>
                    </div>

                    <div class="editor-layout">
                        <form class="panel" id="game-form" autocomplete="off" novalidate></form>

                        <aside class="preview-wrap" aria-label="Card preview">
                            <h3>Preview</h3>
                            <p>How this game looks on the main page.</p>
                            <div id="preview" inert></div>
                        </aside>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <input type="file" id="file-input" accept=".json,application/json" hidden>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
        <form method="dialog">
            <h2 id="confirm-title"></h2>
            <p id="confirm-message"></p>
            <div class="dialog-actions">
                <button type="submit" class="btn" value="cancel">Cancel</button>
                <button type="submit" class="btn btn-danger" id="confirm-ok" value="confirm"></button>
            </div>
        </form>
    </dialog>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script>
        // ---------- Field configuration ----------
        // key: internal name, json: key used in Games.json
        const FIELDS = [
            { key: 'name',        json: 'Name',         label: 'Name',        section: 'basics',  required: true, placeholder: 'Game name' },
            { key: 'description', json: 'Description',  label: 'Description', section: 'basics',  rows: 3, hint: 'Shown on the game card. One or two sentences works best.' },
            { key: 'type',        json: 'Game-Type',    label: 'Type',        section: 'details', chips: true },
            { key: 'players',     json: 'Player-Count', label: 'Players',     section: 'details', chips: true },
            { key: 'time',        json: 'Game-Time',    label: 'Game time',   section: 'details', chips: true },
            { key: 'maturity',    json: 'Maturity',     label: 'Maturity',    section: 'details', chips: true },
            { key: 'brainload',   json: 'Brainload',    label: 'Complexity',  section: 'details', chips: true },
            { key: 'link',        json: 'Link',         label: 'Link',        section: 'links',   optional: true, placeholder: 'Path or URL to the game', hint: 'Adds a Play button and links the title.' },
            { key: 'image',       json: 'Image',        label: 'Image',       section: 'links',   optional: true, placeholder: 'Path or URL to a cover image', hint: 'Optional. Without one, the card shows the first letter of the name.' },
            { key: 'rules',       json: 'Rules',        label: 'Rules',       section: 'rules',   rows: 14, hint: 'Plain text. Line breaks are kept.' }
        ];
        const SECTIONS = { basics: 'Basics', details: 'Details', links: 'Link and image', rules: 'Rules' };
        const KNOWN_JSON_KEYS = new Set(FIELDS.map(f => f.json));

        const ICON_PLAYERS = '<circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4"/><path d="M10.5 3.2a2.4 2.4 0 010 4.6M12 9.8c1.6.5 2.5 1.8 2.5 3.7"/>';
        const ICON_TIME = '<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/>';

        // ---------- State ----------
        const state = {
            loaded: false,
            data: null,        // whole parsed file, so unknown top-level keys survive a save
            games: [],         // { id, values, extra }
            selectedId: null,
            dirty: false,
            fileName: '',
            handle: null,      // FileSystemFileHandle when the browser allows in-place saving
            indent: '    ',
            query: ''
        };
        let nextId = 1;

        // ---------- DOM ----------
        const $ = id => document.getElementById(id);
        const topbar = $('topbar');
        const workspace = $('workspace');
        const welcome = $('welcome');
        const fileStatus = $('file-status');
        const listEl = $('game-list');
        const listCount = $('list-count');
        const listSearch = $('list-search');
        const editorEmpty = $('editor-empty');
        const editorMain = $('editor-main');
        const editorTitle = $('editor-title');
        const form = $('game-form');
        const previewEl = $('preview');
        const fileInput = $('file-input');
        const toastBox = $('toasts');
        const confirmDialog = $('confirm-dialog');
        const inputs = {};

        // ---------- Helpers ----------
        function el(tag, attrs = {}, ...children) {
            const node = document.createElement(tag);
            for (const [name, value] of Object.entries(attrs)) {
                if (value == null || value === false) continue;
                if (name === 'class') node.className = value;
                else if (name === 'text') node.textContent = value;
                else if (name.startsWith('on')) node.addEventListener(name.slice(2), value);
                else node.setAttribute(name, value === true ? '' : value);
            }
            children.flat().forEach(child => {
                if (child == null || child === false) return;
                node.append(child.nodeType ? child : document.createTextNode(child));
            });
            return node;
        }

        function svgIcon(inner) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 16 16');
            svg.setAttribute('aria-hidden', 'true');
            svg.innerHTML = inner;
            return svg;
        }

        const isWide = () => window.matchMedia('(min-width: 900px)').matches;
        const selectedGame = () => state.games.find(g => g.id === state.selectedId) || null;
        const sortedGames = () => state.games.slice().sort((a, b) =>
            a.values.name.trim().localeCompare(b.values.name.trim(), undefined, { sensitivity: 'base' }));

        function toast(message, { tone = 'info', action = null } = {}) {
            const node = el('div', { class: `toast toast-${tone}` }, el('span', { text: message }));
            const close = () => node.remove();
            if (action) {
                node.append(el('button', { type: 'button', class: 'toast-action', text: action.label, onclick: () => { action.run(); close(); } }));
            }
            toastBox.append(node);
            while (toastBox.children.length > 3) toastBox.firstElementChild.remove();
            setTimeout(close, action ? 8000 : 4500);
        }

        function confirmAction({ title, message, confirmLabel }) {
            return new Promise(resolve => {
                $('confirm-title').textContent = title;
                $('confirm-message').textContent = message;
                $('confirm-ok').textContent = confirmLabel;
                confirmDialog.returnValue = '';
                confirmDialog.addEventListener('close', () => resolve(confirmDialog.returnValue === 'confirm'), { once: true });
                confirmDialog.showModal();
            });
        }

        async function discardOk() {
            if (!state.dirty) return true;
            return confirmAction({
                title: 'Discard unsaved changes?',
                message: 'You have edits that have not been saved. Opening another file will lose them.',
                confirmLabel: 'Discard changes'
            });
        }

        // ---------- Data model ----------
        function blankValues() {
            return Object.fromEntries(FIELDS.map(f => [f.key, '']));
        }

        function fromRaw(raw) {
            const values = blankValues();
            const extra = {};
            for (const f of FIELDS) {
                if (raw[f.json] != null) values[f.key] = String(raw[f.json]);
            }
            for (const [k, v] of Object.entries(raw)) {
                if (!KNOWN_JSON_KEYS.has(k)) extra[k] = v; // keep fields this editor doesn't know about
            }
            return { id: nextId++, values, extra };
        }

        function toRaw(game) {
            const out = {};
            for (const f of FIELDS) {
                const v = game.values[f.key].replace(/\r\n/g, '\n').trim();
                if (f.optional && !v) continue;
                out[f.json] = v;
            }
            return { ...out, ...game.extra };
        }

        function serialise() {
            const payload = { ...state.data, 'Game List': state.games.map(toRaw) };
            return JSON.stringify(payload, null, state.indent) + '\n';
        }

        function nameCounts() {
            const counts = new Map();
            state.games.forEach(g => {
                const k = g.values.name.trim().toLowerCase();
                if (k) counts.set(k, (counts.get(k) || 0) + 1);
            });
            return counts;
        }

        // ---------- Loading ----------
        async function loadText(text, name, handle) {
            let data;
            try {
                data = JSON.parse(text);
            } catch (error) {
                toast(`That file is not valid JSON: ${error.message}`, { tone: 'error' });
                return false;
            }
            if (!data || !Array.isArray(data['Game List'])) {
                toast('That file has no "Game List" array, so it does not look like a Games.json.', { tone: 'error' });
                return false;
            }

            const indentMatch = text.match(/^([ \t]+)"/m);
            state.indent = indentMatch ? indentMatch[1] : '    ';
            state.data = data;
            state.games = data['Game List'].filter(g => g && typeof g === 'object').map(fromRaw);
            state.loaded = true;
            state.dirty = false;
            state.fileName = name;
            state.handle = handle;
            state.query = '';
            listSearch.value = '';
            state.selectedId = null;

            const first = isWide() ? sortedGames()[0] : null;
            if (first) selectGame(first.id, { view: 'edit' });
            else { workspace.dataset.view = 'list'; refresh(); }
            return true;
        }

        function startNewList() {
            state.data = {};
            state.games = [];
            state.loaded = true;
            state.dirty = false;
            state.fileName = 'New Games.json';
            state.handle = null;
            state.indent = '    ';
            state.selectedId = null;
            workspace.dataset.view = 'list';
            refresh();
            addGame();
        }

        async function openFile() {
            if (!(await discardOk())) return;
            if (window.showOpenFilePicker) {
                try {
                    const [handle] = await window.showOpenFilePicker({
                        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
                    });
                    const file = await handle.getFile();
                    if (await loadText(await file.text(), file.name, handle)) toast(`Opened ${file.name}`, { tone: 'success' });
                } catch (error) {
                    if (error.name !== 'AbortError') { console.error(error); fileInput.click(); }
                }
            } else {
                fileInput.click();
            }
        }

        // ---------- Saving ----------
        function prepare() {
            const unnamed = state.games.filter(g => !g.values.name.trim());
            if (unnamed.length) {
                selectGame(unnamed[0].id, { view: 'edit', focus: 'name' });
                toast(unnamed.length === 1 ? 'Give this game a name before saving.' : `${unnamed.length} games need a name before saving.`, { tone: 'error' });
                return null;
            }
            return serialise();
        }

        function download(text) {
            const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
            const link = el('a', { href: url, download: 'Games.json' });
            document.body.append(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function save() {
            const text = prepare();
            if (text == null) return;

            if (state.handle || window.showSaveFilePicker) {
                try {
                    if (!state.handle) {
                        state.handle = await window.showSaveFilePicker({
                            suggestedName: 'Games.json',
                            types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
                        });
                        state.fileName = state.handle.name;
                    }
                    const writable = await state.handle.createWritable();
                    await writable.write(text);
                    await writable.close();
                    state.dirty = false;
                    updateChrome();
                    toast(`Saved to ${state.fileName}`, { tone: 'success' });
                    return;
                } catch (error) {
                    if (error.name === 'AbortError') return;
                    console.error(error);
                    state.handle = null;
                    toast('Could not write to the file, so a copy was downloaded instead.', { tone: 'error' });
                }
            }

            download(text);
            state.dirty = false;
            updateChrome();
            toast('Downloaded Games.json. Replace the file in your repo, then commit it.', { tone: 'success' });
        }

        async function copyJson() {
            const text = prepare();
            if (text == null) return;
            try {
                await navigator.clipboard.writeText(text);
                toast('Copied the full JSON to your clipboard', { tone: 'success' });
            } catch (error) {
                console.error(error);
                toast('Could not copy to the clipboard. Use Download instead.', { tone: 'error' });
            }
        }

        // ---------- Actions ----------
        function markDirty() {
            if (!state.dirty) { state.dirty = true; updateChrome(); }
        }

        function addGame() {
            const game = { id: nextId++, values: blankValues(), extra: {} };
            state.games.push(game);
            state.query = '';
            listSearch.value = '';
            markDirty();
            selectGame(game.id, { view: 'edit', focus: 'name' });
        }

        function duplicateGame() {
            const source = selectedGame();
            if (!source) return;
            const copy = { id: nextId++, values: { ...source.values }, extra: structuredClone(source.extra) };
            copy.values.name = `${source.values.name.trim() || 'Untitled game'} (copy)`;
            state.games.push(copy);
            markDirty();
            selectGame(copy.id, { view: 'edit', focus: 'name' });
            inputs.name.select();
            toast('Duplicated. Rename it and adjust the details.');
        }

        function deleteGame() {
            const game = selectedGame();
            if (!game) return;
            const order = sortedGames();
            const pos = order.findIndex(g => g.id === game.id);
            const neighbour = order[pos + 1] || order[pos - 1] || null;
            const index = state.games.findIndex(g => g.id === game.id);

            state.games.splice(index, 1);
            markDirty();
            if (neighbour && isWide()) selectGame(neighbour.id, { view: 'edit' });
            else { state.selectedId = null; workspace.dataset.view = 'list'; refresh(); }

            toast(`Deleted “${game.values.name.trim() || 'Untitled game'}”`, {
                action: {
                    label: 'Undo',
                    run: () => {
                        state.games.splice(Math.min(index, state.games.length), 0, game);
                        markDirty();
                        selectGame(game.id, { view: 'edit' });
                    }
                }
            });
        }

        function selectGame(id, { view = null, focus = null } = {}) {
            state.selectedId = id;
            const game = selectedGame();
            if (view) workspace.dataset.view = view;
            refresh();
            if (game) {
                populateForm(game);
                listEl.querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest' });
                if (focus && inputs[focus]) inputs[focus].focus({ preventScroll: false });
            }
        }

        // ---------- Rendering ----------
        function refresh() {
            updateChrome();
            renderList();
            const game = selectedGame();
            editorMain.hidden = !game;
            editorEmpty.hidden = !!game;
            $('editor-empty-text').textContent = state.games.length
                ? 'Pick a game from the list to edit it, or add a new one.'
                : 'This list is empty. Add your first game to get started.';
        }

        function updateChrome() {
            welcome.hidden = state.loaded;
            workspace.hidden = !state.loaded;
            ['btn-copy', 'btn-download', 'btn-save'].forEach(id => { $(id).disabled = !state.loaded; });

            fileStatus.replaceChildren();
            if (state.loaded) {
                fileStatus.append(
                    el('span', { text: state.fileName }),
                    state.dirty
                        ? el('span', { class: 'pill', 'data-state': 'dirty', text: 'Unsaved changes' })
                        : el('span', { class: 'pill', 'data-state': 'saved', text: 'All changes saved' })
                );
            } else {
                fileStatus.append(el('span', { class: 'pill', text: 'No file open' }));
            }
            document.title = `${state.dirty ? '• ' : ''}Kay Games editor`;
        }

        function renderList() {
            const counts = nameCounts();
            const q = state.query.trim().toLowerCase();
            const items = sortedGames().filter(g =>
                !q || [g.values.name, g.values.type, g.values.players].some(v => v.toLowerCase().includes(q)));

            listCount.textContent = q
                ? `${items.length} of ${state.games.length} games`
                : `${state.games.length} ${state.games.length === 1 ? 'game' : 'games'}`;

            if (!items.length) {
                listEl.replaceChildren(el('li', { class: 'list-empty', text: q ? 'No games match your search.' : 'No games yet.' }));
                return;
            }

            listEl.replaceChildren(...items.map(game => {
                const name = game.values.name.trim();
                const problem = !name ? 'Needs a name' : counts.get(name.toLowerCase()) > 1 ? 'Another game has the same name' : '';
                return el('li', {},
                    el('button', {
                        type: 'button',
                        class: 'game-item',
                        'aria-current': String(game.id === state.selectedId),
                        onclick: () => selectGame(game.id, { view: 'edit' })
                    },
                        el('span', { class: 'game-item-top' },
                            el('span', { class: 'game-item-name' + (name ? '' : ' is-blank'), text: name || 'Untitled game' }),
                            problem ? el('span', { class: 'game-item-flag', role: 'img', 'aria-label': problem, title: problem, text: '!' }) : null
                        ),
                        el('span', { class: 'game-item-meta' },
                            game.values.type ? el('span', { text: game.values.type }) : null,
                            game.values.players ? el('span', { text: game.values.players }) : null
                        )
                    )
                );
            }));
        }

        // ---------- Form ----------
        function buildForm() {
            form.replaceChildren();
            for (const [section, title] of Object.entries(SECTIONS)) {
                const fields = FIELDS.filter(f => f.section === section).map(buildField);
                form.append(el('section', { class: 'form-section' },
                    el('h3', { text: title }),
                    el('div', { class: `section-grid section-${section}` }, fields)
                ));
            }
        }

        function buildField(f) {
            const id = `f-${f.key}`;
            const common = { id, 'data-key': f.key, placeholder: f.placeholder || '' };
            const input = f.rows
                ? el('textarea', { ...common, rows: f.rows, 'aria-describedby': f.hint ? `hint-${f.key}` : null })
                : el('input', { ...common, type: 'text', spellcheck: f.optional ? 'false' : null, autocapitalize: f.optional ? 'off' : null });
            inputs[f.key] = input;

            return el('div', { class: 'field', 'data-field': f.key },
                el('label', { for: id, text: f.label }),
                input,
                f.chips ? el('div', { class: 'chips', 'data-chips': f.key, role: 'group', 'aria-label': `${f.label} suggestions` }) : null,
                f.required ? el('p', { class: 'msg', id: `msg-${f.key}`, role: 'alert', hidden: true }) : null,
                f.hint ? el('p', { class: 'hint', id: `hint-${f.key}`, text: f.hint }) : null
            );
        }

        function populateForm(game) {
            FIELDS.forEach(f => { inputs[f.key].value = game.values[f.key]; });
            FIELDS.filter(f => f.chips).forEach(f => renderChips(f.key));
            updateNameMessage(game);
            editorTitle.textContent = game.values.name.trim() || 'New game';
            previewKey = null;
            renderPreview(game);
        }

        // Suggest values already used by other games, most common first
        function renderChips(key) {
            const box = form.querySelector(`[data-chips="${key}"]`);
            if (!box) return;
            const current = selectedGame();
            const counts = new Map();
            state.games.forEach(g => {
                if (g === current) return;
                const v = g.values[key].trim();
                if (v) counts.set(v, (counts.get(v) || 0) + 1);
            });
            const ranked = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], undefined, { numeric: true }));
            const active = current ? current.values[key].trim() : '';

            inputs[key].placeholder = ranked.length ? `e.g. ${ranked[0][0]}` : 'Type a value';
            box.replaceChildren(...ranked.slice(0, 12).map(([value]) =>
                el('button', {
                    type: 'button',
                    class: 'chip',
                    'aria-pressed': String(value === active),
                    text: value,
                    onclick: () => {
                        inputs[key].value = value;
                        inputs[key].dispatchEvent(new Event('input', { bubbles: true }));
                    }
                })
            ));
        }

        function updateNameMessage(game) {
            const msg = $('msg-name');
            const name = game.values.name.trim();
            const dup = name && state.games.some(g => g !== game && g.values.name.trim().toLowerCase() === name.toLowerCase());
            if (!name) { msg.textContent = 'A name is required before you can save.'; msg.dataset.tone = 'error'; msg.hidden = false; }
            else if (dup) { msg.textContent = 'Another game already uses this name.'; msg.dataset.tone = 'warn'; msg.hidden = false; }
            else { msg.hidden = true; }
        }

        form.addEventListener('input', event => {
            const key = event.target.dataset && event.target.dataset.key;
            const game = selectedGame();
            if (!key || !game) return;

            game.values[key] = event.target.value;
            markDirty();
            if (key === 'name') editorTitle.textContent = game.values.name.trim() || 'New game';
            if (FIELDS.find(f => f.key === key).chips) renderChips(key);
            updateNameMessage(game);
            renderPreview(game);
            renderList();
        });

        form.addEventListener('submit', event => event.preventDefault());

        // ---------- Preview ----------
        let previewKey = null;
        let previewMedia = null;

        function renderPreview(game) {
            const v = game.values;
            const name = v.name.trim() || 'Untitled game';
            const image = v.image.trim();
            const initial = name[0].toUpperCase();

            // Only rebuild the image when it (or the fallback letter) changes, to avoid flicker while typing
            const key = `${image}|${initial}`;
            if (key !== previewKey) {
                previewKey = key;
                const fallback = () => el('div', { class: 'media-fallback', 'aria-hidden': 'true', text: initial });
                previewMedia = el('div', { class: 'card-media' });
                if (image) {
                    const img = el('img', { src: image, alt: '' });
                    img.addEventListener('error', () => previewMedia.replaceChildren(fallback()), { once: true });
                    previewMedia.append(img);
                } else {
                    previewMedia.append(fallback());
                }
            }

            const facts = el('div', { class: 'facts' },
                v.players.trim() ? el('span', {}, svgIcon(ICON_PLAYERS), v.players.trim()) : null,
                v.time.trim() ? el('span', {}, svgIcon(ICON_TIME), v.time.trim()) : null
            );
            const tags = el('ul', { class: 'tags' },
                v.type.trim() ? el('li', { class: 'tag tag-type', text: v.type.trim() }) : null,
                v.maturity.trim() ? el('li', { class: 'tag', text: v.maturity.trim() }) : null,
                v.brainload.trim() ? el('li', { class: 'tag', text: v.brainload.trim() }) : null
            );
            const actions = el('div', { class: 'card-actions' },
                v.link.trim() ? el('div', { class: 'btn btn-primary', text: 'Play' }) : null,
                v.rules.trim() ? el('div', { class: 'btn', text: 'Rules' }) : null
            );

            previewEl.replaceChildren(el('article', { class: 'card' },
                previewMedia,
                el('div', { class: 'card-body' },
                    el('h2', { class: 'card-title' + (v.link.trim() ? ' is-link' : '') }, el('span', { text: name })),
                    facts.children.length ? facts : null,
                    tags.children.length ? tags : null,
                    v.description.trim() ? el('p', { class: 'card-desc', text: v.description.trim() }) : null,
                    actions.children.length ? actions : null
                )
            ));
        }

        // ---------- Events ----------
        $('btn-open').addEventListener('click', openFile);
        $('welcome-open').addEventListener('click', openFile);
        $('welcome-new').addEventListener('click', startNewList);
        $('btn-save').addEventListener('click', save);
        $('btn-copy').addEventListener('click', copyJson);
        $('btn-download').addEventListener('click', () => { const t = prepare(); if (t != null) { download(t); toast('Downloaded Games.json', { tone: 'success' }); } });
        $('btn-new').addEventListener('click', addGame);
        $('empty-new').addEventListener('click', addGame);
        $('btn-duplicate').addEventListener('click', duplicateGame);
        $('btn-delete').addEventListener('click', deleteGame);
        $('btn-back').addEventListener('click', () => { workspace.dataset.view = 'list'; renderList(); });

        listSearch.addEventListener('input', () => { state.query = listSearch.value; renderList(); });

        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0];
            fileInput.value = '';
            if (!file) return;
            if (await loadText(await file.text(), file.name, null)) {
                toast(`Opened ${file.name}. Save will download an updated copy.`, { tone: 'success' });
            }
        });

        document.addEventListener('keydown', event => {
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
                event.preventDefault();
                if (state.loaded) save();
            }
        });

        window.addEventListener('beforeunload', event => {
            if (state.dirty) { event.preventDefault(); event.returnValue = ''; }
        });

        // Drag a Games.json anywhere onto the page
        window.addEventListener('dragover', event => {
            if (event.dataTransfer && [...event.dataTransfer.types].includes('Files')) {
                event.preventDefault();
                document.body.classList.add('dragging');
            }
        });
        window.addEventListener('dragleave', event => { if (event.relatedTarget === null) document.body.classList.remove('dragging'); });
        window.addEventListener('drop', async event => {
            event.preventDefault();
            document.body.classList.remove('dragging');
            const item = event.dataTransfer.items && event.dataTransfer.items[0];
            const file = event.dataTransfer.files[0];
            if (!file) return;
            if (!(await discardOk())) return;
            let handle = null;
            try {
                if (item && item.getAsFileSystemHandle) {
                    const h = await item.getAsFileSystemHandle();
                    if (h && h.kind === 'file') handle = h;
                }
            } catch (error) { console.error(error); }
            if (await loadText(await file.text(), file.name, handle)) toast(`Opened ${file.name}`, { tone: 'success' });
        });

        // Keep sticky offsets accurate when the top bar wraps
        new ResizeObserver(() => {
            document.documentElement.style.setProperty('--topbar-h', `${topbar.offsetHeight}px`);
        }).observe(topbar);

        // ---------- Init ----------
        async function init() {
            buildForm();
            updateChrome();
            try {
                const response = await fetch('Games.json', { cache: 'no-store' });
                if (!response.ok) throw new Error(`Status ${response.status}`);
                await loadText(await response.text(), 'Games.json (loaded from the site)', null);
            } catch (error) {
                console.info('Games.json was not loaded automatically:', error);
                updateChrome();
            }
        }

        init();
    </script>
</body>
</html>
